<style>
    /* ═══════════════════════════════════════════════════════════════════════
       ModernBlog — Apple Human Interface Guidelines (HIG) Design System
       Liquid Glass Controls · Standard Content Materials · SF Typography
       ═══════════════════════════════════════════════════════════════════════ */
    :root {
        color-scheme: dark;
        /* ── Typography (HIG San Francisco / PingFang Optical Stack) ── */
        --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
        --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
        --font-heading: var(--font-display);
        --mono: "SF Mono", ui-monospace, "Fira Code", Menlo, Monaco, Consolas, monospace;

        /* ── Dynamic Accent (solid flat accent, zero gradients) ── */
        --accent: {{ theme_colors.accent }};
        --accent2: {{ theme_colors.accent2 }};
        --accent3: {{ theme_colors.accent3 }};
        --grad: var(--accent);
        --grad2: var(--accent);
        --border-accent: {{ theme_colors.border_accent }};

        /* ── HIG Dark Appearance Semantic Colors ── */
        --bg: #0b0b0e;
        --label-primary: rgba(255, 255, 255, 0.96);
        --label-secondary: rgba(235, 235, 245, 0.68);
        --label-tertiary: rgba(235, 235, 245, 0.44);
        --label-quaternary: rgba(235, 235, 245, 0.24);
        --text: var(--label-primary);

        /* ── HIG Standard Materials (Content Layer) ── */
        --material-regular: rgba(28, 28, 30, 0.68);
        --material-thick: rgba(24, 24, 27, 0.84);
        --material-thin: rgba(36, 36, 40, 0.52);
        --fill-primary: rgba(120, 120, 128, 0.30);
        --fill-secondary: rgba(120, 120, 128, 0.22);
        --fill-tertiary: rgba(118, 118, 128, 0.16);
        --separator: rgba(255, 255, 255, 0.11);
        --separator-subtle: rgba(255, 255, 255, 0.06);

        /* ── HIG Liquid Glass (Control & Navigation Layer) ── */
        --glass-surface: rgba(32, 32, 36, 0.56);
        --glass-surface-strong: rgba(26, 26, 30, 0.78);
        --glass-clear: rgba(255, 255, 255, 0.10);
        --glass-rim: inset 0 1px 0 rgba(255, 255, 255, 0.24), inset 0 -0.5px 0 rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.16);
        --glass-shadow: 0 12px 36px rgba(0, 0, 0, 0.34), 0 2px 8px rgba(0, 0, 0, 0.20);

        /* Legacy token aliases for full compatibility with _enhance.html / JS */
        --glass: var(--fill-tertiary);
        --glass-md: var(--fill-secondary);
        --glass-heavy: var(--material-thick);
        --border: var(--separator);
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.36);
        --shadow-accent: 0 8px 24px color-mix(in srgb, var(--accent) 32%, transparent);

        /* ── HIG Motion Curves (Fluid, Tactile, Interruptible) ── */
        --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-std: cubic-bezier(0.25, 0.1, 0.25, 1);
        --ease-spring: cubic-bezier(0.34, 1.48, 0.64, 1);
        --ease-spring-soft: cubic-bezier(0.22, 1.25, 0.45, 1);
        --ease-spring-snappy: cubic-bezier(0.18, 0.9, 0.32, 1.2);
        --ease-press: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-sheet: cubic-bezier(0.32, 1.15, 0.46, 1);

        /* ── HIG Continuous Corner Radii & Layout Metrics ── */
        --r-sm: 10px;
        --r-md: 14px;
        --r-lg: 22px;
        --r-sheet: 26px;
        --r-pill: 999px;
        --sidebar-w: 308px;
        --nav-h: 54px;
    }

    /* ── Reset & Base ── */
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }

    body {
        font-family: var(--font-text);
        color: var(--label-primary);
        background: var(--bg);
        font-size: 16px;
        line-height: 1.65;
        overflow-x: hidden;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
    }

    p, h1, h2, h3, h4, h5, h6, span, a, li, td, th {
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    img {
        max-width: 100%;
        height: auto;
        display: block;
    }

    ul { list-style: none; }

    a {
        color: var(--accent);
        text-decoration: none;
        transition: color .2s var(--ease-std), opacity .2s var(--ease-std);
    }

    button {
        cursor: pointer;
        border: none;
        background: none;
        font-family: inherit;
        color: inherit;
    }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .svg-icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        display: inline-block;
        flex-shrink: 0;
    }
    .svg-icon[fill="none"] { stroke: currentColor; }

    /* ── Ambient Wallpaper & Depth Scrim ──
       将模糊直接应用在静态背景图层 .bg-fixed 上（GPU 仅光栅化缓存一次），
       避免 .bg-overlay 每帧对全屏做 backdrop-filter 实时采样导致移动端严重掉帧。 */
    .bg-fixed {
        position: fixed;
        inset: -24px;
        z-index: -2;
        {% if config.bg_url %}
        background: url('{{ config.bg_url }}') center/cover no-repeat;
        filter: blur(16px) saturate(1.12);
        {% else %}
        background: var(--bg);
        {% endif %}
        transform: translateZ(0);
    }

    .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: rgba(11, 11, 14, 0.56);
    }

    /* ── Top Reading / SPA Progress Bar ── */
    #progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 2.5px;
        width: 0%;
        background: var(--accent);
        z-index: 9999;
        transition: width .12s linear, opacity .25s var(--ease-std);
        border-radius: 0 2px 2px 0;
    }

    /* ── Soft SPA Transition Veil ── */
    #page-transition {
        position: fixed;
        inset: 0;
        z-index: 8000;
        background: rgba(11, 11, 14, 0.14);
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        opacity: 0;
        pointer-events: none;
        transition: opacity .16s var(--ease-out), backdrop-filter .16s var(--ease-out), -webkit-backdrop-filter .16s var(--ease-out);
    }
    #page-transition.active {
        opacity: 1;
        pointer-events: all;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       1. FLOATING LIQUID GLASS NAVIGATION BAR
       ═══════════════════════════════════════════════════════════════════════ */
    nav {
        position: sticky;
        top: 14px;
        z-index: 1000;
        width: min(1200px, calc(100% - 28px));
        margin: 14px auto -68px;
        height: var(--nav-h);
        padding: 0 8px 0 8px;
        border-radius: var(--r-pill);
        background: var(--glass-surface);
        backdrop-filter: blur(28px) saturate(195%);
        -webkit-backdrop-filter: blur(28px) saturate(195%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-rim), var(--glass-shadow);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        transition: background .3s var(--ease-std), box-shadow .3s var(--ease-std), border-color .3s var(--ease-std), transform .35s var(--ease-out);
    }

    nav.scrolled {
        background: var(--glass-surface-strong);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: var(--glass-rim), 0 18px 42px rgba(0, 0, 0, 0.45);
    }

    nav.cnfte-enter {
        animation: higNavDrop .48s var(--ease-out) both;
    }

    @keyframes higNavDrop {
        from { opacity: 0; transform: translateY(-10px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* HIG 44x44 ergonomic nav icon controls */
    #nav-menu-toggle,
    .nav-lang,
    #search-toggle {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: var(--r-pill);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--label-primary);
        font-size: 1.05rem;
        background: transparent;
        transition: background .2s var(--ease-std), color .2s var(--ease-std), transform .28s var(--ease-spring);
    }

    #nav-menu-toggle:hover,
    .nav-lang:hover,
    #search-toggle:hover {
        background: rgba(255, 255, 255, 0.13);
        color: #fff;
    }

    #nav-menu-toggle:active,
    .nav-lang:active,
    #search-toggle:active {
        transform: scale(0.90);
    }

    .logo {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--label-primary);
        padding: 6px 12px;
        border-radius: var(--r-pill);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity .2s var(--ease-std), transform .25s var(--ease-spring);
    }
    .logo:hover {
        color: #fff;
        opacity: 0.88;
    }

    /* Search Capsule */
    .search-wrap {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
    }

    #search-input {
        width: 0;
        opacity: 0;
        pointer-events: none;
        height: 38px;
        padding: 0;
        border-radius: var(--r-pill);
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.10);
        color: var(--label-primary);
        font-family: var(--font-text);
        font-size: 0.875rem;
        outline: none;
        transition: width .35s var(--ease-out), opacity .25s var(--ease-std), padding .3s var(--ease-out), border-color .2s;
    }

    #search-input::placeholder {
        color: var(--label-tertiary);
    }

    .search-wrap.open #search-input {
        width: 220px;
        opacity: 1;
        pointer-events: auto;
        padding: 0 14px;
        border-color: rgba(255, 255, 255, 0.16);
    }

    .search-wrap.open #search-input:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.14);
    }

    /* Search Results Popover (HIG Regular Liquid Glass) */
    #search-dropdown {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(360px, 86vw);
        max-height: 360px;
        overflow-y: auto;
        padding: 8px;
        border-radius: 20px;
        background: var(--glass-surface-strong);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-rim), 0 24px 60px rgba(0, 0, 0, 0.55);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px) scale(0.97);
        transition: opacity .22s var(--ease-out), transform .28s var(--ease-spring), visibility .22s;
        z-index: 1200;
    }

    #search-dropdown.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }

    #search-dropdown .s-item {
        display: block;
        padding: 10px 14px;
        border-radius: 12px;
        color: var(--label-primary);
        font-size: 0.875rem;
        font-weight: 500;
        transition: background .18s var(--ease-std);
    }
    #search-dropdown .s-item:hover {
        background: rgba(255, 255, 255, 0.11);
        color: #fff;
    }
    #search-dropdown .s-loading,
    #search-dropdown .s-empty {
        padding: 18px 14px;
        text-align: center;
        color: var(--label-secondary);
        font-size: 0.84rem;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       2. SLIDE-OVER NAVIGATION SIDEBAR SHEET
       ═══════════════════════════════════════════════════════════════════════ */
    body.nav-menu-locked { overflow: hidden; }

    .nav-menu-overlay {
        position: fixed;
        inset: 0;
        z-index: 4000;
        pointer-events: none;
        visibility: hidden;
        transition: visibility .35s;
    }
    .nav-menu-overlay.open {
        pointer-events: auto;
        visibility: visible;
    }

    .nav-menu-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        transition: opacity .3s var(--ease-std);
    }
    .nav-menu-overlay.open .nav-menu-backdrop { opacity: 1; }

    .nav-menu-panel {
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 12px;
        width: min(300px, calc(100vw - 24px));
        border-radius: var(--r-sheet);
        background: var(--glass-surface-strong);
        backdrop-filter: blur(36px) saturate(200%);
        -webkit-backdrop-filter: blur(36px) saturate(200%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-rim), 0 24px 64px rgba(0, 0, 0, 0.56);
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        transform: translateX(calc(-100% - 24px));
        transition: transform .42s var(--ease-sheet);
    }
    .nav-menu-overlay.open .nav-menu-panel {
        transform: translateX(0);
    }

    .nav-menu-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px 14px 10px;
        border-bottom: 1px solid var(--separator);
        margin-bottom: 12px;
    }

    .nav-menu-brand {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--label-primary);
    }

    .nav-menu-close {
        width: 36px;
        height: 36px;
        border-radius: var(--r-pill);
        background: var(--fill-secondary);
        color: var(--label-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        transition: background .2s, transform .25s var(--ease-spring);
    }
    .nav-menu-close:hover { background: var(--fill-primary); }
    .nav-menu-close:active { transform: scale(0.90); }

    .nav-menu-links {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
    }

    .nav-menu-links::-webkit-scrollbar,
    .toc-widget::-webkit-scrollbar,
    #search-dropdown::-webkit-scrollbar,
    .notice-box::-webkit-scrollbar {
        width: 5px;
        height: 5px;
    }
    .nav-menu-links::-webkit-scrollbar-track,
    .toc-widget::-webkit-scrollbar-track,
    #search-dropdown::-webkit-scrollbar-track,
    .notice-box::-webkit-scrollbar-track {
        background: transparent;
    }
    .nav-menu-links::-webkit-scrollbar-thumb,
    .toc-widget::-webkit-scrollbar-thumb,
    #search-dropdown::-webkit-scrollbar-thumb,
    .notice-box::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 999px;
    }

    .nav-menu-links a {
        display: flex;
        align-items: center;
        padding: 12px 14px;
        border-radius: 13px;
        color: var(--label-primary);
        font-size: 0.95rem;
        font-weight: 500;
        min-height: 44px;
        transition: background .18s var(--ease-std), color .18s;
    }
    .nav-menu-links a:hover {
        background: rgba(255, 255, 255, 0.11);
        color: #fff;
    }
    .nav-menu-links a:active {
        background: rgba(255, 255, 255, 0.16);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       3. NOTICE SHEET MODAL (Checkbox-driven, HIG Sheet presentation)
       ═══════════════════════════════════════════════════════════════════════ */
    #notice-toggle {
        position: fixed;
        opacity: 0;
        pointer-events: none;
    }

    .notice-modal-wrap {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        pointer-events: none;
        visibility: hidden;
        transition: visibility .32s;
    }

    .notice-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.52);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        transition: opacity .3s var(--ease-std);
    }
    .notice-backdrop-label {
        position: absolute;
        inset: 0;
        cursor: pointer;
    }

    .notice-box {
        position: relative;
        width: min(460px, 100%);
        max-height: 80dvh;
        overflow-y: auto;
        border-radius: var(--r-sheet);
        background: var(--glass-surface-strong);
        backdrop-filter: blur(36px) saturate(200%);
        -webkit-backdrop-filter: blur(36px) saturate(200%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-rim), 0 28px 72px rgba(0, 0, 0, 0.6);
        padding: 22px 24px 26px;
        opacity: 0;
        transform: translateY(28px) scale(0.95);
        transition: opacity .28s var(--ease-out), transform .42s var(--ease-sheet);
    }

    #notice-toggle:checked ~ .notice-modal-wrap {
        pointer-events: auto;
        visibility: visible;
    }
    #notice-toggle:checked ~ .notice-modal-wrap .notice-backdrop {
        opacity: 1;
    }
    #notice-toggle:checked ~ .notice-modal-wrap .notice-box {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .notice-box-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 14px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--separator);
    }

    .notice-box-title {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--label-primary);
    }
    .notice-box-title .svg-icon { color: var(--accent); }

    .notice-close-label {
        width: 32px;
        height: 32px;
        border-radius: var(--r-pill);
        background: var(--fill-secondary);
        color: var(--label-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background .2s, transform .25s var(--ease-spring);
    }
    .notice-close-label:hover { background: var(--fill-primary); }
    .notice-close-label:active { transform: scale(0.90); }

    .notice-body {
        font-size: 0.94rem;
        line-height: 1.75;
        color: var(--label-secondary);
    }
    .notice-body a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       4. INDEX HERO (Full-Bleed Editorial Artwork + Clear Liquid Glass Pills)
       ═══════════════════════════════════════════════════════════════════════ */
    #hero-wrap {
        width: 100%;
    }

    .hero {
        position: relative;
        width: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 108px 24px 88px;
        overflow: hidden;
    }

    .hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        filter: brightness(0.76) saturate(1.08);
        transform: scale(1.03);
    }

    .hero-gradient {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: rgba(11, 11, 14, 0.42);
    }

    .hero-intro-layout {
        position: relative;
        z-index: 2;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: higHeroIn .65s var(--ease-out) both;
    }

    @keyframes higHeroIn {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .hero-avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        padding: 3px;
        background: rgba(255, 255, 255, 0.24);
        border: 1px solid rgba(255, 255, 255, 0.32);
        margin-bottom: 22px;
        object-fit: cover;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
        animation: cnfteSpin 12s linear infinite;
        transition: transform .45s var(--ease-spring), box-shadow .35s var(--ease-std);
    }
    .hero-avatar:hover {
        transform: scale(1.06);
        animation-play-state: paused;
        box-shadow: 0 22px 52px rgba(0, 0, 0, 0.52);
    }

    .hero-name {
        font-family: var(--font-display);
        font-size: clamp(2.1rem, 5vw, 3.25rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.12;
        color: #fff;
        margin-bottom: 12px;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
    }

    .hero-bio {
        font-size: clamp(0.95rem, 1.8vw, 1.08rem);
        font-weight: 400;
        color: rgba(255, 255, 255, 0.82);
        max-width: 540px;
        min-height: 1.8em;
        margin-bottom: 26px;
        line-height: 1.65;
    }

    .hero-contacts {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 18px;
    }

    /* Clear Liquid Glass Contact Pills over Media */
    .hero-contact-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: var(--r-pill);
        background: rgba(28, 28, 32, 0.48);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.20);
        box-shadow: var(--glass-rim), 0 6px 20px rgba(0, 0, 0, 0.24);
        color: rgba(255, 255, 255, 0.92);
        font-size: 0.85rem;
        font-weight: 500;
        transition: transform .3s var(--ease-spring), background .2s, border-color .2s, color .2s;
    }
    .hero-contact-link:hover {
        background: rgba(255, 255, 255, 0.20);
        border-color: rgba(255, 255, 255, 0.36);
        color: #fff;
        transform: translateY(-2px);
    }
    .hero-contact-link:active { transform: scale(0.94); }

    .hero-notice-trigger {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 0 16px;
        border-radius: var(--r-pill);
        background: color-mix(in srgb, var(--accent) 18%, rgba(28, 28, 32, 0.56));
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid color-mix(in srgb, var(--accent) 44%, rgba(255, 255, 255, 0.16));
        color: #fff;
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform .3s var(--ease-spring), background .2s, border-color .2s;
    }
    .hero-notice-trigger:hover {
        background: color-mix(in srgb, var(--accent) 28%, rgba(28, 28, 32, 0.64));
        transform: translateY(-2px);
    }
    .hero-notice-trigger:active { transform: scale(0.95); }

    .hero-scroll-hint {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: rgba(255, 255, 255, 0.56);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        transition: color .2s, transform .25s var(--ease-spring);
    }
    .hero-scroll-hint:hover {
        color: #fff;
        transform: translateX(-50%) translateY(3px);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       5. POST DETAIL HERO
       ═══════════════════════════════════════════════════════════════════════ */
    .post-hero {
        position: relative;
        width: 100%;
        min-height: 44dvh;
        max-height: 520px;
        display: flex;
        align-items: flex-end;
        padding: 112px 24px 44px;
        overflow: hidden;
    }

    .post-hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        filter: brightness(0.72) saturate(1.06);
    }

    .post-hero-gradient {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: rgba(11, 11, 14, 0.48);
    }

    .post-header-content {
        position: relative;
        z-index: 2;
        width: min(1200px, 100%);
        margin: 0 auto;
        animation: higHeroIn .55s var(--ease-out) both;
    }

    .post-tagline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--label-secondary);
        margin-bottom: 12px;
        letter-spacing: 0.01em;
    }

    .post-header-content h1 {
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 4.2vw, 2.75rem);
        font-weight: 700;
        letter-spacing: -0.028em;
        line-height: 1.18;
        color: #fff;
        max-width: 880px;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       6. MAIN STRUCTURED LAYOUT (Zone 1: Bento Overview · Zone 2: 2-Col Feed · Zone 3: Sidebar)
       ═══════════════════════════════════════════════════════════════════════ */
    .layout-wrapper {
        width: min(1200px, calc(100% - 28px));
        margin: 28px auto 64px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--sidebar-w);
        gap: 22px;
        align-items: start;
        flex: 1;
    }

    /* ── Zone 1: Overview Bento Strip (GitHub Heatmap + Site Stats) ── */
    .overview-bento {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--sidebar-w);
        gap: 22px;
        align-items: stretch;
    }
    .overview-bento.heatmap-off {
        grid-template-columns: minmax(0, 1fr);
    }
    .overview-bento.heatmap-off .stats-grid-2x2 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .bento-card {
        background: rgba(28, 28, 32, 0.78);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 10px 28px rgba(0, 0, 0, 0.24);
        border-radius: var(--r-lg);
        padding: 20px 22px;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .heatmap-card {
        justify-content: space-between;
        gap: 14px;
    }

    .heatmap-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
    }

    .heatmap-title-wrap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }
    .heatmap-title-wrap .svg-icon {
        color: var(--label-primary);
        font-size: 1rem;
    }

    .bento-title {
        font-family: var(--font-display);
        font-size: 0.92rem;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: var(--label-primary);
    }

    .heatmap-user {
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--label-secondary);
        padding: 2px 9px;
        border-radius: var(--r-pill);
        background: var(--fill-tertiary);
        border: 1px solid var(--separator-subtle);
        transition: background .2s, color .2s;
    }
    .heatmap-user:hover {
        background: var(--fill-primary);
        color: #fff;
    }

    .heatmap-total {
        font-size: 0.78rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
    }

    .heatmap-scroll {
        container-type: inline-size;
        overflow-x: auto;
        overflow-y: clip;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        /* 为边缘热力块放大 + 选中边框预留安全内边距，防止顶部/左右/底部被裁切 */
        padding: 5px;
        margin: -5px;
    }
    .heatmap-scroll::-webkit-scrollbar {
        display: none;
    }

    .heatmap-grid {
        --hm-gap: clamp(2px, 0.4cqi, 4px);
        display: grid;
        grid-template-rows: repeat(7, auto);
        grid-auto-flow: column;
        grid-auto-columns: minmax(10px, 1fr);
        gap: var(--hm-gap);
        inline-size: 100%;
    }

    .hm-cell {
        display: block;
        inline-size: 100%;
        block-size: auto;
        aspect-ratio: 1;
        border-radius: 2.5px;
        background: rgba(255, 255, 255, 0.065);
        cursor: pointer;
        transition: transform .15s var(--ease-spring), outline-color .15s;
    }
    .heatmap-legend .hm-cell {
        inline-size: 10px;
        block-size: 10px;
        cursor: default;
    }
    .hm-cell[data-level="1"] { background: color-mix(in srgb, var(--accent) 30%, rgba(255, 255, 255, 0.06)); }
    .hm-cell[data-level="2"] { background: color-mix(in srgb, var(--accent) 55%, rgba(255, 255, 255, 0.06)); }
    .hm-cell[data-level="3"] { background: color-mix(in srgb, var(--accent) 78%, rgba(255, 255, 255, 0.06)); }
    .hm-cell[data-level="4"] { background: var(--accent); }
    .heatmap-grid .hm-cell:hover,
    .heatmap-grid .hm-cell.selected {
        transform: scale(1.32);
        outline: 1.5px solid rgba(255, 255, 255, 0.78);
        outline-offset: 0.5px;
        position: relative;
        z-index: 2;
    }

    .heatmap-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.74rem;
        color: var(--label-tertiary);
    }
    .heatmap-source {
        font-variant-numeric: tabular-nums;
        transition: color .18s var(--ease-std);
    }
    .heatmap-source.active {
        color: var(--label-primary);
        font-weight: 600;
    }
    .heatmap-legend {
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    /* Right Stats Bento Card */
    .stats-bento-card {
        justify-content: space-between;
        gap: 14px;
    }

    .stats-grid-2x2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .stat-tile {
        padding: 12px 13px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--separator-subtle);
        display: flex;
        flex-direction: column;
        gap: 3px;
    }
    .stat-val {
        font-family: var(--font-display);
        font-size: 1.12rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .stat-label {
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--label-tertiary);
    }

    .stats-quote {
        padding-top: 10px;
        border-top: 1px solid var(--separator-subtle);
        font-size: 0.78rem;
        line-height: 1.5;
        color: var(--label-secondary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* ── Zone 2: Main Reading Area (2-Column Editorial Grid) ── */
    #main-content {
        min-width: 0;
    }

    .post-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        align-content: start;
    }

    .posts-section-head {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 2px 4px;
    }

    .posts-section-title {
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    .posts-section-title h2 {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
    }
    .posts-count-pill {
        padding: 2px 10px;
        border-radius: var(--r-pill);
        background: var(--fill-tertiary);
        border: 1px solid var(--separator-subtle);
        color: var(--label-secondary);
        font-size: 0.74rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    #cnfte-pagination,
    #cnfte-tags-hub,
    .empty-state {
        grid-column: 1 / -1;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       7. POST CARDS (Symmetrical Apple News Editorial Grid Cards)
       ═══════════════════════════════════════════════════════════════════════ */
    .post-card {
        display: flex;
        flex-direction: column;
        background: rgba(28, 28, 32, 0.78);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 10px 30px rgba(0, 0, 0, 0.24);
        border-radius: var(--r-lg);
        overflow: hidden;
        transition: transform .36s var(--ease-spring), border-color .25s var(--ease-std), background .25s var(--ease-std), box-shadow .32s var(--ease-out);
    }

    .post-card:hover {
        transform: translateY(-3px);
        background: rgba(36, 36, 40, 0.84);
        border-color: rgba(255, 255, 255, 0.20);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 18px 44px rgba(0, 0, 0, 0.38);
    }

    /* 当当前页可见文章数为奇数时，首张卡片自动转为跨两栏横向焦点卡，杜绝末行留白空位 */
    .post-card.is-featured {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
    }
    .post-card.is-featured .post-cover {
        aspect-ratio: auto;
        height: 100%;
        min-height: 210px;
    }
    .post-card.is-featured .post-content {
        justify-content: center;
        padding: 24px 26px;
    }
    .post-card.is-featured .post-title {
        font-size: 1.24rem;
    }

    .post-cover {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        flex-shrink: 0;
    }

    .post-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .55s var(--ease-out);
    }

    .post-card:hover .post-cover img {
        transform: scale(1.045);
    }

    .post-cover-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        pointer-events: none;
    }

    .post-content {
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        flex: 1;
        min-width: 0;
    }

    .post-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        font-size: 0.75rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--label-tertiary);
    }

    .post-meta .tag {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: var(--r-pill);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
    }

    .post-title {
        font-family: var(--font-display);
        font-size: 1.08rem;
        font-weight: 650;
        letter-spacing: -0.016em;
        line-height: 1.38;
        color: var(--label-primary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: color .2s var(--ease-std);
    }
    .post-card:hover .post-title {
        color: #fff;
    }
    .post-title:hover {
        color: var(--accent);
    }

    .post-summary {
        font-size: 0.85rem;
        line-height: 1.6;
        color: var(--label-secondary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .empty-state {
        padding: 56px 24px;
        text-align: center;
        border-radius: var(--r-lg);
        background: var(--material-regular);
        border: 1px solid var(--separator);
        color: var(--label-secondary);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-size: 0.95rem;
    }
    .empty-state .svg-icon { font-size: 2rem; opacity: 0.6; }

    /* ═══════════════════════════════════════════════════════════════════════
       8. ARTICLE READING SURFACE (post.html — Safari Reader / Apple News)
       ═══════════════════════════════════════════════════════════════════════ */
    .post-container {
        background: rgba(28, 28, 32, 0.80);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 14px 36px rgba(0, 0, 0, 0.28);
        border-radius: 24px;
        padding: clamp(24px, 4vw, 44px);
    }

    .post-body {
        font-size: 1.05rem;
        line-height: 1.82;
        color: rgba(255, 255, 255, 0.88);
    }

    .post-body h1,
    .post-body h2,
    .post-body h3,
    .post-body h4 {
        font-family: var(--font-display);
        color: #fff;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.3;
        margin: 1.8em 0 0.7em;
    }
    .post-body h1 { font-size: 1.75rem; }
    .post-body h2 {
        font-size: 1.42rem;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--separator);
    }
    .post-body h3 { font-size: 1.18rem; }
    .post-body h4 { font-size: 1.04rem; }

    .post-body p { margin-bottom: 1.2em; }

    .post-body a {
        color: var(--accent);
        text-decoration: none;
        padding: 1px 4px;
        margin: 0 -2px;
        border-radius: 6px;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
        transition: background-color .18s var(--ease-std), border-color .18s var(--ease-std), color .18s;
    }
    .post-body a:hover {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        border-bottom-color: var(--accent);
    }

    /* 独立行链接 / 附件下载卡片（Apple HIG Grouped Pill Card） */
    .post-body a.post-link-card {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 1.2em 0;
        padding: 13px 16px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--separator);
        color: var(--label-primary);
        text-decoration: none;
        transition: transform .28s var(--ease-spring), background-color .2s, border-color .2s;
    }
    .post-body a.post-link-card:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: color-mix(in srgb, var(--accent) 55%, rgba(255,255,255,0.16));
        transform: translateY(-2px);
    }
    .post-link-card .plc-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .post-link-card .plc-info {
        flex: 1;
        min-width: 0;
    }
    .post-link-card .plc-title {
        display: block;
        font-size: 0.94rem;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .post-link-card .plc-meta {
        display: block;
        font-size: 0.76rem;
        color: var(--label-tertiary);
        font-family: var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
    }
    .post-link-card .plc-arrow {
        color: var(--label-tertiary);
        flex-shrink: 0;
        transition: transform .22s var(--ease-spring), color .2s;
    }
    .post-link-card:hover .plc-arrow {
        color: var(--accent);
        transform: translateX(3px);
    }

    /* GFM 提示框（NOTE / TIP / IMPORTANT / WARNING / CAUTION） */
    .post-body .post-callout {
        margin: 1.4em 0;
        padding: 15px 18px;
        border-radius: 15px;
        border: 1px solid var(--separator);
        border-left: 3.5px solid var(--callout-c, var(--accent));
        background: color-mix(in srgb, var(--callout-c, var(--accent)) 10%, rgba(255,255,255,0.03));
        color: var(--label-primary);
    }
    .post-body .post-callout .pc-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--callout-c, var(--accent));
        margin-bottom: 6px;
        letter-spacing: 0.02em;
    }
    .post-body .post-callout p:last-child { margin-bottom: 0; }
    .post-body .callout-note { --callout-c: #60a5fa; }
    .post-body .callout-tip { --callout-c: #34d399; }
    .post-body .callout-important { --callout-c: #a78bfa; }
    .post-body .callout-warning { --callout-c: #fbbf24; }
    .post-body .callout-caution { --callout-c: #fb7185; }

    /* 折叠面板（Apple HIG Grouped Disclosure Card，内部自动包裹 .details-body） */
    .post-body details {
        margin: 1.4em 0;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--separator);
        overflow: hidden;
        transition: border-color .2s, background-color .2s;
    }
    .post-body details[open] {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.055);
    }
    .post-body details > summary {
        list-style: none;
        cursor: pointer;
        padding: 13px 18px;
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        color: #fff;
        user-select: none;
        transition: background-color .18s;
    }
    .post-body details > summary::-webkit-details-marker { display: none; }
    .post-body details > summary:hover {
        background: rgba(255, 255, 255, 0.05);
    }
    .post-body details > summary::after {
        content: '';
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--label-secondary);
        border-bottom: 2px solid var(--label-secondary);
        transform: rotate(-45deg);
        transition: transform .25s var(--ease-spring), border-color .2s;
        flex-shrink: 0;
    }
    .post-body details[open] > summary {
        border-bottom: 1px solid var(--separator);
    }
    .post-body details[open] > summary::after {
        transform: rotate(45deg);
        border-color: var(--accent);
    }
    .post-body details > .details-body {
        padding: 14px 18px 16px;
        color: var(--label-secondary);
        line-height: 1.75;
    }
    .post-body details > .details-body > :first-child { margin-top: 0; }
    .post-body details > .details-body > :last-child { margin-bottom: 0; }

    /* 自定义 Apple HIG 正文音频卡片（替代丑陋原生 audio 条） */
    .post-audio-card {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 1.4em 0;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .post-audio-card .pac-play {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--accent);
        color: #0b0b0e;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
        transition: transform .25s var(--ease-spring), filter .2s;
    }
    .post-audio-card .pac-play:hover { filter: brightness(1.08); transform: scale(1.05); }
    .post-audio-card .pac-play:active { transform: scale(0.92); }
    .post-audio-card .pac-play svg { width: 18px; height: 18px; pointer-events: none; }
    .post-audio-card .pac-main { flex: 1; min-width: 0; }
    .post-audio-card .pac-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
    }
    .post-audio-card .pac-name {
        font-size: 0.88rem;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .post-audio-card .pac-time {
        font-size: 0.74rem;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        color: var(--label-tertiary);
        flex-shrink: 0;
    }
    .post-audio-card .pac-bar {
        position: relative;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        cursor: pointer;
        overflow: hidden;
    }
    .post-audio-card .pac-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: var(--accent);
        border-radius: 999px;
        pointer-events: none;
    }
    .post-audio-card .pac-dl {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--fill-tertiary);
        color: var(--label-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: none;
        padding: 0;
        margin: 0;
        transition: background .2s, color .2s;
    }
    .post-audio-card .pac-dl:hover {
        background: var(--fill-primary);
        color: #fff;
        border: none;
    }

    /* macOS 风格美化代码块容器（语言徽章 + 一键复制 + 换行切换） */
    .post-code-wrap {
        margin: 1.5em 0;
        border-radius: 16px;
        background: #101014;
        border: 1px solid var(--separator);
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.30);
    }
    .post-code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 14px;
        background: rgba(255, 255, 255, 0.045);
        border-bottom: 1px solid var(--separator-subtle);
        user-select: none;
    }
    .post-code-left {
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    .post-code-dots {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff5f57;
        box-shadow: 15px 0 0 #febc2e, 30px 0 0 #28c840;
        margin-right: 30px;
        opacity: 0.85;
    }
    .post-code-lang {
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--label-secondary);
    }
    .post-code-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .post-code-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--separator-subtle);
        color: var(--label-secondary);
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        transition: background .18s, color .18s, border-color .18s;
    }
    .post-code-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.22);
    }
    .post-code-btn.copied {
        color: #34d399;
        border-color: rgba(52, 211, 153, 0.45);
        background: rgba(52, 211, 153, 0.12);
    }
    .post-code-wrap pre {
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        padding: 16px 18px !important;
    }
    .post-code-wrap.is-wrapped pre,
    .post-code-wrap.is-wrapped pre code {
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* 响应式表格容器 */
    .post-table-wrap {
        margin: 1.5em 0;
        overflow-x: auto;
        border-radius: 14px;
        border: 1px solid var(--separator);
        background: rgba(255, 255, 255, 0.025);
        overscroll-behavior-x: contain;
    }
    .post-table-wrap table {
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
    }
    .post-table-wrap tbody tr:hover td {
        background: rgba(255, 255, 255, 0.04);
    }

    /* 标题锚点复制按钮 */
    .post-body h2, .post-body h3, .post-body h4 {
        position: relative;
    }
    .post-heading-anchor {
        margin-left: 8px;
        font-size: 0.8em;
        color: var(--label-tertiary);
        opacity: 0;
        cursor: pointer;
        border: none !important;
        padding: 0 4px !important;
        background: transparent !important;
        transition: opacity .18s, color .18s;
    }
    .post-body h2:hover .post-heading-anchor,
    .post-body h3:hover .post-heading-anchor,
    .post-body h4:hover .post-heading-anchor,
    .post-heading-anchor:focus-visible {
        opacity: 1;
        color: var(--accent);
    }

    /* 全屏图片灯箱 & Toast 轻提示 */
    #cnfte-lightbox {
        position: fixed;
        inset: 0;
        z-index: 9500;
        background: rgba(8, 8, 12, 0.86);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        cursor: zoom-out;
        transition: opacity .24s var(--ease-out), visibility .24s;
    }
    #cnfte-lightbox.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }
    #cnfte-lightbox img {
        max-width: min(92dvw, 1200px);
        max-height: 82dvh;
        object-fit: contain;
        border-radius: 16px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
        transform: scale(0.95);
        transition: transform .3s var(--ease-spring);
    }
    #cnfte-lightbox.open img { transform: scale(1); }
    #cnfte-lightbox .lb-cap {
        font-size: 0.86rem;
        color: var(--label-secondary);
        text-align: center;
        max-width: 640px;
    }

    #cnfte-toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 9600;
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(28, 28, 34, 0.92);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-rim), 0 12px 32px rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 600;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 14px);
        transition: opacity .22s var(--ease-out), transform .28s var(--ease-spring);
    }
    #cnfte-toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    /* 媒体播放器（video / audio / iframe 统一圆角暗色封装） */
    .post-body video,
    .post-body iframe {
        display: block;
        width: 100%;
        max-height: 70dvh;
        margin: 1.5em auto;
        border-radius: 16px;
        border: 1px solid var(--separator);
        background: #08080b;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
    }
    .post-body iframe {
        aspect-ratio: 16 / 9;
        height: auto;
    }
    .post-body audio {
        display: block;
        width: 100%;
        height: 46px;
        margin: 1.4em 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--separator);
        padding: 4px 10px;
        color-scheme: dark;
    }

    /* 待办清单复选框 & 删除线 & 数学公式卡片 */
    .post-body li.task-item {
        list-style: none;
        margin-left: -1.2em;
    }
    .post-body input[type="checkbox"] {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
        margin-right: 6px;
        vertical-align: -2px;
    }
    .post-body del {
        color: var(--label-tertiary);
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.45);
    }
    .post-body .post-math-block {
        margin: 1.4em 0;
        padding: 16px 20px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--separator-subtle);
        overflow-x: auto;
        text-align: center;
    }
    .post-body .post-math-block .katex-display {
        margin: 0 !important;
    }

    .post-body ul,
    .post-body ol {
        margin: 0 0 1.25em 1.4em;
        list-style: disc;
    }
    .post-body ol { list-style: decimal; }
    .post-body li { margin-bottom: 0.45em; }

    .post-body blockquote {
        margin: 1.4em 0;
        padding: 14px 18px;
        border-left: 3.5px solid var(--accent);
        border-radius: 0 14px 14px 0;
        background: rgba(255, 255, 255, 0.05);
        color: var(--label-secondary);
    }
    .post-body blockquote p:last-child { margin-bottom: 0; }

    .post-body code {
        font-family: var(--mono);
        font-size: 0.86em;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.10);
        color: #f5f5f7;
    }

    .post-body pre {
        margin: 1.4em 0;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(16, 16, 20, 0.86);
        border: 1px solid var(--separator);
        overflow-x: auto;
        line-height: 1.6;
    }
    .post-body pre code {
        padding: 0;
        background: transparent;
        font-size: 0.86rem;
        color: #e5e5ea;
    }

    /* 图片自适应容器并限制最大舒适观感高度（宽图铺满、竖图不撑爆屏幕，点击可灯箱放大） */
    .post-body img {
        display: block;
        max-width: 100%;
        width: auto;
        max-height: min(68dvh, 620px);
        height: auto;
        object-fit: contain;
        margin: 1.6em auto;
        border-radius: 16px;
        border: 1px solid var(--separator);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
        cursor: zoom-in;
        transition: transform .28s var(--ease-spring), box-shadow .25s;
    }
    .post-body img:hover {
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.44);
    }

    .post-body hr {
        border: none;
        height: 1px;
        background: var(--separator);
        margin: 2em 0;
    }

    .post-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.4em 0;
        font-size: 0.92rem;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid var(--separator);
    }
    .post-body th,
    .post-body td {
        padding: 11px 14px;
        text-align: left;
        border-bottom: 1px solid var(--separator-subtle);
    }
    .post-body th {
        background: rgba(255, 255, 255, 0.06);
        font-weight: 600;
        color: #fff;
    }

    .btn-wrapper {
        margin-top: 32px;
        padding-top: 22px;
        border-top: 1px solid var(--separator);
        display: flex;
        justify-content: flex-start;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: var(--r-pill);
        background: var(--fill-secondary);
        border: 1px solid var(--separator);
        color: var(--label-primary);
        font-size: 0.9rem;
        font-weight: 600;
        transition: background .2s, transform .28s var(--ease-spring), border-color .2s;
    }
    .back-btn:hover {
        background: var(--fill-primary);
        border-color: rgba(255, 255, 255, 0.22);
        color: #fff;
        transform: translateX(-2px);
    }
    .back-btn:active { transform: scale(0.95); }

    /* Friend Links Grid */
    .post-friends {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
    }

    .friend-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border-radius: 18px;
        background: rgba(28, 28, 32, 0.78);
        border: 1px solid var(--separator);
        color: var(--label-primary);
        transition: transform .3s var(--ease-spring), background .2s, border-color .2s;
    }
    .friend-card:hover {
        transform: translateY(-2px);
        background: rgba(44, 44, 48, 0.74);
        border-color: rgba(255, 255, 255, 0.20);
    }
    .friend-card img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
    }
    .friend-info { min-width: 0; }
    .friend-info b {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
    }
    .friend-info span {
        display: block;
        font-size: 0.78rem;
        color: var(--label-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ═══════════════════════════════════════════════════════════════════════
       9. SIDEBAR INSPECTOR WIDGETS (HIG Grouped Materials)
       ═══════════════════════════════════════════════════════════════════════ */
    #site-aside {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
    }

    .widget {
        background: rgba(28, 28, 32, 0.78);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 10px 28px rgba(0, 0, 0, 0.24);
        border-radius: var(--r-lg);
        padding: 20px;
    }

    .widget-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-display);
        font-size: 0.82rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: var(--label-secondary);
        margin-bottom: 14px;
    }
    .widget-title .svg-icon {
        color: var(--accent);
        font-size: 0.95rem;
    }

    /* Profile Widget (post.html sidebar) */
    .profile-widget {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .profile-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        padding: 2px;
        border: 1.5px solid rgba(255, 255, 255, 0.24);
        margin-bottom: 12px;
        animation: cnfteSpin 12s linear infinite;
        transition: transform .35s var(--ease-spring);
    }
    .profile-avatar:hover {
        transform: scale(1.06);
        animation-play-state: paused;
    }

    .profile-name {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
    }

    .profile-bio {
        font-size: 0.84rem;
        color: var(--label-secondary);
        margin-bottom: 14px;
    }

    .social-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
    }
    .social-links a {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 34px;
        padding: 0 12px;
        border-radius: var(--r-pill);
        background: var(--fill-tertiary);
        border: 1px solid var(--separator-subtle);
        color: var(--label-primary);
        font-size: 0.78rem;
        font-weight: 500;
        transition: background .2s, color .2s, transform .25s var(--ease-spring);
    }
    .social-links a:hover {
        background: var(--fill-primary);
        color: #fff;
        transform: translateY(-1px);
    }

    /* TOC Widget */
    .toc-widget {
        font-size: 0.84rem;
        max-height: 320px;
        overflow-y: auto;
    }
    .toc-widget ul { padding-left: 12px; }
    .toc-widget > ul { padding-left: 0; }
    .toc-widget a {
        display: block;
        padding: 5px 10px;
        border-radius: 9px;
        color: var(--label-secondary);
        line-height: 1.45;
        transition: background .18s, color .18s;
    }
    .toc-widget a:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
    }

    /* Anime Widget (Apple TV List Rows) */
    .anime-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .anime-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--separator-subtle);
        transition: background .2s;
    }
    .anime-item:hover { background: rgba(255, 255, 255, 0.08); }

    .anime-cover,
    .anime-cover-placeholder {
        width: 44px;
        height: 60px;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--label-tertiary);
    }

    .anime-info { flex: 1; min-width: 0; }
    .anime-title {
        display: block;
        font-size: 0.86rem;
        font-weight: 600;
        color: var(--label-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .anime-ep {
        font-size: 0.75rem;
        color: var(--label-secondary);
        margin-top: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .anime-status {
        flex-shrink: 0;
        padding: 3px 8px;
        border-radius: var(--r-pill);
        font-size: 0.7rem;
        font-weight: 600;
    }
    .anime-status.airing {
        background: rgba(48, 209, 88, 0.16);
        color: #30d158;
    }
    .anime-status.ended {
        background: var(--fill-tertiary);
        color: var(--label-secondary);
    }

    .notice-widget-content {
        font-size: 0.86rem;
        line-height: 1.7;
        color: var(--label-secondary);
    }

    /* macOS-inspired System Info Terminal Card */
    .terminal-widget {
        background: rgba(20, 20, 24, 0.84);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 10px 28px rgba(0, 0, 0, 0.26);
        border-radius: var(--r-lg);
        padding: 18px 20px;
        font-family: var(--mono);
        font-size: 0.76rem;
        line-height: 1.85;
        font-variant-numeric: tabular-nums;
    }
    .terminal-widget::before {
        content: '';
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff5f57;
        box-shadow: 17px 0 0 #febc2e, 34px 0 0 #28c840;
        margin-bottom: 14px;
        opacity: 0.88;
    }
    .t-line { color: var(--label-secondary); }
    .t-accent { color: var(--accent); font-weight: 600; }
    .t-val { color: var(--label-primary); font-weight: 500; }
    .t-dim { color: var(--label-tertiary); margin-top: 4px; }

    /* ═══════════════════════════════════════════════════════════════════════
       10. FOOTER (Clean Inset Material)
       ═══════════════════════════════════════════════════════════════════════ */
    #site-footer {
        width: min(1200px, calc(100% - 28px));
        margin: 0 auto 28px;
        padding: 24px 28px;
        border-radius: var(--r-lg);
        background: rgba(28, 28, 32, 0.80);
        border: 1px solid var(--separator);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 18px;
    }

    .foot-text {
        font-size: 0.82rem;
        line-height: 1.7;
        color: var(--label-secondary);
    }
    .foot-copy {
        margin-top: 6px;
        font-size: 0.74rem;
        color: var(--label-tertiary);
        font-variant-numeric: tabular-nums;
    }

    .foot-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .foot-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 13px;
        border-radius: var(--r-pill);
        background: var(--fill-tertiary);
        border: 1px solid var(--separator-subtle);
        color: var(--label-primary);
        font-size: 0.78rem;
        font-weight: 500;
        transition: background .2s, color .2s, transform .25s var(--ease-spring);
    }
    .foot-badge:hover {
        background: var(--fill-primary);
        color: #fff;
        transform: translateY(-2px);
